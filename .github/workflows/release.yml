name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.11
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          echo "/opt/gradle-8.11/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Create placeholder .env (secrets plugin needs a file)
        run: echo "# placeholder — no secrets" > .env

      - name: Assemble debug APK
        run: gradle assembleDebug

      - name: Locate APK
        id: apk_path
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "APK_NOT_FOUND" >> $GITHUB_OUTPUT
          else
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release with APK asset
        if: steps.apk_path.outputs.apk_path != 'APK_NOT_FOUND'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Thoshan Chat Android ${{ github.ref_name }}
          body: |
            ## Thoshan Chat — Android APK ${{ github.ref_name }}

            ### Download
            Download `app-debug.apk` from the **Assets** section on the right.

            ### Installation
            1. Download the APK from this release page.
            2. On your Android device, enable **Install unknown apps** for your browser/File Manager.
            3. Open the downloaded APK and tap **Install**.
            4. Open **Thoshan · Portfolio Assistant** and start chatting.

            ### What's in this release
            - ✅ Real Speech-to-Text (native Android SpeechRecognizer) — no API key, works offline
            - ✅ Real Text-to-Speech (native Android TextToSpeech) — no API key, works offline
            - ✅ Works on Android 8.0 (API 26) through Android 15+ (API 35)
            - ✅ Zero third-party voice dependencies — zero extra APK size
            - ✅ Front-end only, no backend required
            - ✅ 30-second voice capture cap with live level meter
            - ✅ Hands-free voice call mode (listen → think → speak)
            - ✅ Dark theme by default, with Light/System options
            - ✅ Chat history, search, settings, attachments (photos/camera/files)
            - ✅ Per-message speaker button with idle/loading/speaking/paused states

            ### Requirements
            - Android 8.0+ (API level 26 or higher)
            - Microphone permission (granted at first use)
            - A TTS voice pack installed on your device (Google TTS is pre-installed on most devices)

            ### Privacy
            - No API keys embedded in the APK
            - Speech processing happens on-device
            - Chat history stays on your device (DataStore)
            - No network calls for voice features
          files: ${{ steps.apk_path.outputs.apk_path }}
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: thoshan-chat-android-apk
          path: ${{ steps.apk_path.outputs.apk_path }}
          retention-days: 90
