name: Build & Release APK

# Builds a release-signed APK when a vX.Y.Z tag is pushed and attaches it to a
# GitHub Release as Thoshan-vX.Y.Z.apk. Signing material comes from repository
# secrets (see RELEASING.md) — never from files in this repository.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create placeholder .env (secrets plugin needs a file)
        run: echo "# placeholder — no secrets" > .env

      - name: Restore release keystore from secrets
        env:
          THOSHAN_KEYSTORE_BASE64: ${{ secrets.THOSHAN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$THOSHAN_KEYSTORE_BASE64" ]; then
            echo "::error::THOSHAN_KEYSTORE_BASE64 secret is not set (see RELEASING.md)"
            exit 1
          fi
          mkdir -p "$HOME/.config/thoshan-android"
          echo "$THOSHAN_KEYSTORE_BASE64" | base64 -d > "$HOME/.config/thoshan-android/thoshan-release.keystore"
          chmod 600 "$HOME/.config/thoshan-android/thoshan-release.keystore"

      - name: Build signed release APK
        env:
          THOSHAN_STORE_PASSWORD: ${{ secrets.THOSHAN_STORE_PASSWORD }}
          THOSHAN_KEY_ALIAS: ${{ secrets.THOSHAN_KEY_ALIAS }}
          THOSHAN_KEY_PASSWORD: ${{ secrets.THOSHAN_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK identity and signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BADGING=$(aapt2 dump badging "$APK")
          echo "$BADGING" | head -1
          echo "$BADGING" | grep -q "name='in.lingadevaru.thoshan'" || { echo "::error::wrong applicationId"; exit 1; }
          echo "$BADGING" | grep -q "label='Thoshan'" || { echo "::error::wrong app label"; exit 1; }
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "$BADGING" | grep -q "versionName='$VERSION'" || { echo "::error::versionName does not match tag $TAG"; exit 1; }
          apksigner verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -q "CN=Thoshan" /tmp/certs.txt || { echo "::error::APK not signed with the Thoshan release key"; exit 1; }

      - name: Name the APK asset
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Thoshan-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release with APK asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Thoshan Android ${{ github.ref_name }}
          files: Thoshan-${{ github.ref_name }}.apk
          body: |
            ## Thoshan Android ${{ github.ref_name }}

            Download `Thoshan-${{ github.ref_name }}.apk` from **Assets** and open it on your phone to install.

            - Application ID: `in.lingadevaru.thoshan`
            - Requires Android 8.0+ (API 26)
            - Install unknown apps permission needed for browser/file-manager installs
            - If you previously installed the old `com.ai.studio.portfolioassistant.thoshan` build, uninstall it first — this is a new application identity and will not conflict.
